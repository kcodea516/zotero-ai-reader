name: Bug report
description: Report a reproducible problem with the plugin.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "English and Chinese reports are welcome. Remove API keys and private material from screenshots or logs."
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version and channel
      placeholder: "1.3.2 stable, or 1.4.0-beta.2 preview"
    validations:
      required: true
  - type: input
    id: zotero-version
    attributes:
      label: Zotero version
      placeholder: "10.0.6"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Provider, model ID, and streaming setting (if relevant)
      description: "Do not include keys or private endpoint URLs."
      placeholder: "Provider / model ID / streaming on or off"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a PDF…\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot, error, or public PDF example
      description: "A small public or synthetic PDF is helpful for extraction and annotation issues. State any relevant plugins and the language setting."
